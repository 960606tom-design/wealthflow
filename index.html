<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>豐收記帳 WealthFlow iOS</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              bgLight: '#F2F2F7',
              bgDark: '#000000',
              cardLight: '#FFFFFF',
              cardDark: '#1C1C1E',
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              orange: '#FF9500',
              gray: '#8E8E93',
              grayLight: '#E5E5EA',
              grayDark: '#2C2C2E',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- JsBarcode for E-Invoice Barcode Generation -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    /* iOS WebApp Fullscreen Lock */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 20px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .glass-header {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
  </style>
</head>
<body class="bg-ios-bgLight dark:bg-ios-bgDark text-gray-900 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Main App Shell -->
  <div id="app" class="flex-1 flex flex-col max-w-md mx-auto w-full relative pb-24 shadow-2xl">
    
    <!-- Top Bar -->
    <header class="sticky top-0 z-30 safe-top glass-header bg-white/80 dark:bg-black/80 border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-ios-blue flex items-center justify-center text-white font-bold text-lg shadow-sm">
          豐
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight" id="appTitle">記帳總覽</h1>
          <p class="text-[10px] text-ios-gray" id="currentDateStr">2026 年 10 月</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="toggleDemoData()" class="px-2 py-1 text-xs bg-gray-200 dark:bg-ios-grayDark text-ios-blue rounded-lg font-medium">
          載入/清空範例
        </button>
        <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300">
          <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-amber-400"></i>
        </button>
      </div>
    </header>

    <!-- Content Sections -->
    <main class="flex-1 px-4 pt-4 space-y-4">

      <!-- ================= TAB 1: 記帳總覽 ================= -->
      <section id="tab-transactions" class="tab-content space-y-4">
        <!-- Dashboard Summary Card -->
        <div class="bg-gradient-to-br from-ios-blue to-blue-600 rounded-3xl p-5 text-white shadow-lg">
          <p class="text-xs text-blue-100 font-medium">本月結餘</p>
          <div class="text-3xl font-extrabold mt-1 tracking-tight" id="summaryNet">NT$ 0</div>
          
          <div class="grid grid-cols-2 gap-4 mt-5 pt-4 border-t border-white/20">
            <div>
              <span class="text-[11px] text-blue-100 flex items-center gap-1">
                <i data-lucide="arrow-down-left" class="w-3.5 h-3.5 text-green-300"></i> 總收入
              </span>
              <p class="text-lg font-bold mt-0.5" id="summaryIncome">NT$ 0</p>
            </div>
            <div>
              <span class="text-[11px] text-blue-100 flex items-center gap-1">
                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5 text-red-300"></i> 總支出
              </span>
              <p class="text-lg font-bold mt-0.5" id="summaryExpense">NT$ 0</p>
            </div>
          </div>
        </div>

        <!-- Add Transaction Button & List -->
        <div class="flex items-center justify-between pt-2">
          <h2 class="text-base font-bold">消費與收入明細</h2>
          <button onclick="openModal('modal-transaction')" class="flex items-center space-x-1 px-3 py-1.5 bg-ios-blue text-white rounded-full text-xs font-semibold shadow-sm active:scale-95 transition-transform">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>記一筆</span>
          </button>
        </div>

        <div id="transactionList" class="space-y-2.5">
          <!-- Transaction items injected here -->
        </div>
      </section>

      <!-- ================= TAB 2: 固定收支 ================= -->
      <section id="tab-recurring" class="tab-content hidden space-y-4">
        <div class="bg-ios-cardLight dark:bg-ios-cardDark rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-800">
          <div class="flex justify-between items-center">
            <div>
              <p class="text-xs text-ios-gray">每月固定支出負擔</p>
              <p class="text-2xl font-bold text-ios-red mt-0.5" id="recurringTotalCost">NT$ 0</p>
            </div>
            <button onclick="openModal('modal-recurring')" class="flex items-center space-x-1 px-3 py-1.5 bg-ios-blue text-white rounded-full text-xs font-semibold">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>新增項目</span>
            </button>
          </div>
        </div>

        <div class="space-y-2">
          <h2 class="text-xs font-semibold text-ios-gray px-1 uppercase tracking-wider">固定收支列表</h2>
          <div id="recurringList" class="space-y-2">
            <!-- Recurring items injected here -->
          </div>
        </div>
      </section>

      <!-- ================= TAB 3: 股票存股 ================= -->
      <section id="tab-stocks" class="tab-content hidden space-y-4">
        <!-- Stock Overview Header -->
        <div class="bg-ios-cardLight dark:bg-ios-cardDark rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-800 space-y-4">
          <div>
            <p class="text-xs text-ios-gray">存股總市值 (NTD)</p>
            <p class="text-3xl font-extrabold text-gray-900 dark:text-white mt-0.5" id="stockMarketValue">NT$ 0</p>
          </div>
          
          <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-100 dark:border-gray-800">
            <div>
              <p class="text-[11px] text-ios-gray">未實現總損益</p>
              <p class="text-base font-bold mt-0.5" id="stockPnl">NT$ 0 (0.00%)</p>
            </div>
            <div>
              <p class="text-[11px] text-ios-gray">預估年被動股利</p>
              <p class="text-base font-bold text-ios-blue mt-0.5" id="stockAnnualDividend">NT$ 0</p>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <h2 class="text-base font-bold">持股清單</h2>
          <button onclick="openModal('modal-stock')" class="flex items-center space-x-1 px-3 py-1.5 bg-ios-blue text-white rounded-full text-xs font-semibold">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>新增持股</span>
          </button>
        </div>

        <div id="stockList" class="space-y-2.5">
          <!-- Stock items injected here -->
        </div>
      </section>

      <!-- ================= TAB 4: 發票載具 ================= -->
      <section id="tab-invoice" class="tab-content hidden space-y-4">
        <!-- Barcode Display Card -->
        <div id="barcodeCard" class="bg-white rounded-3xl p-6 text-center text-gray-900 shadow-md border border-gray-200 transition-all duration-300">
          <p class="text-xs text-gray-500 font-medium mb-1">電子發票手機條碼</p>
          <p class="text-xl font-mono font-bold tracking-widest text-ios-blue mb-4" id="displayCarrierCode">/AB12345</p>
          
          <div class="bg-white p-3 rounded-xl border border-gray-100 inline-block w-full">
            <svg id="barcodeSvg" class="w-full h-24 mx-auto"></svg>
          </div>

          <div class="mt-4 flex gap-2">
            <button onclick="toggleMaxBrightness()" class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1">
              <i data-lucide="sun" class="w-4 h-4"></i>
              <span id="brightText">螢幕亮點</span>
            </button>
            <button onclick="openModal('modal-carrier')" class="flex-1 py-2 bg-ios-blue text-white rounded-xl text-xs font-semibold flex items-center justify-center space-x-1">
              <i data-lucide="edit-2" class="w-4 h-4"></i>
              <span>修改載具號碼</span>
            </button>
          </div>
        </div>
      </section>

    </main>

    <!-- Bottom Navigation Bar (iOS Style) -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 max-w-md mx-auto glass-header bg-white/80 dark:bg-black/80 border-t border-gray-200 dark:border-gray-800 safe-bottom">
      <div class="grid grid-cols-4 h-14">
        <button onclick="switchTab('transactions', '記帳總覽')" class="tab-btn flex flex-col items-center justify-center text-ios-blue" data-tab="transactions">
          <i data-lucide="wallet" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium mt-1">記帳</span>
        </button>
        <button onclick="switchTab('recurring', '固定收支')" class="tab-btn flex flex-col items-center justify-center text-ios-gray" data-tab="recurring">
          <i data-lucide="calendar-clock" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium mt-1">固定收支</span>
        </button>
        <button onclick="switchTab('stocks', '股票存股')" class="tab-btn flex flex-col items-center justify-center text-ios-gray" data-tab="stocks">
          <i data-lucide="trending-up" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium mt-1">存股</span>
        </button>
        <button onclick="switchTab('invoice', '發票載具')" class="tab-btn flex flex-col items-center justify-center text-ios-gray" data-tab="invoice">
          <i data-lucide="qr-code" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium mt-1">載具</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- ================= MODALS ================= -->

  <!-- Modal 1: 新增記帳 -->
  <div id="modal-transaction" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center">
    <div class="bg-white dark:bg-ios-cardDark w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-800 pb-3">
        <h3 class="font-bold text-base">新增記帳紀錄</h3>
        <button onclick="closeModal('modal-transaction')" class="text-ios-gray"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="handleAddTransaction(event)" class="space-y-3">
        <div class="flex rounded-xl bg-gray-100 dark:bg-ios-grayDark p-1">
          <button type="button" onclick="setTxType('expense')" id="btn-type-expense" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-white dark:bg-gray-800 shadow-sm text-ios-red">支出</button>
          <button type="button" onclick="setTxType('income')" id="btn-type-income" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-ios-gray">收入</button>
        </div>
        <input type="hidden" id="tx-type" value="expense">

        <div>
          <label class="text-[11px] text-ios-gray font-medium">金額 (NTD)</label>
          <input type="number" id="tx-amount" required placeholder="0" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-lg font-bold text-ios-blue outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] text-ios-gray font-medium">分類</label>
            <select id="tx-category" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none">
              <option value="餐飲美食">餐飲美食</option>
              <option value="交通出行">交通出行</option>
              <option value="休閒娛樂">休閒娛樂</option>
              <option value="購物消費">購物消費</option>
              <option value="工作薪資">工作薪資</option>
              <option value="投資收益">投資收益</option>
              <option value="其他雜項">其他雜項</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] text-ios-gray font-medium">支付帳戶</label>
            <select id="tx-account" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none">
              <option value="現金">現金</option>
              <option value="信用卡">信用卡</option>
              <option value="銀行帳戶">銀行帳戶</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-ios-gray font-medium">備註說明</label>
          <input type="text" id="tx-note" placeholder="例如：午餐麥當勞" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none" />
        </div>

        <button type="submit" class="w-full py-3 bg-ios-blue text-white font-bold rounded-xl text-xs shadow-md mt-2">保存紀錄</button>
      </form>
    </div>
  </div>

  <!-- Modal 2: 新增固定收支 -->
  <div id="modal-recurring" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center">
    <div class="bg-white dark:bg-ios-cardDark w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-800 pb-3">
        <h3 class="font-bold text-base">新增固定收支項目</h3>
        <button onclick="closeModal('modal-recurring')" class="text-ios-gray"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="handleAddRecurring(event)" class="space-y-3">
        <div>
          <label class="text-[11px] text-ios-gray font-medium">項目名稱</label>
          <input type="text" id="rec-title" required placeholder="例如：Netflix 訂閱 / 房屋租金" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] text-ios-gray font-medium">金額 (每月)</label>
            <input type="number" id="rec-amount" required placeholder="0" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs font-bold text-ios-blue outline-none" />
          </div>
          <div>
            <label class="text-[11px] text-ios-gray font-medium">扣款/入帳日</label>
            <input type="number" id="rec-day" min="1" max="31" required placeholder="每個月幾號 (如 15)" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none" />
          </div>
        </div>

        <div>
          <label class="text-[11px] text-ios-gray font-medium">類型</label>
          <select id="rec-type" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none">
            <option value="expense">固定支出</option>
            <option value="income">固定收入</option>
          </select>
        </div>

        <button type="submit" class="w-full py-3 bg-ios-blue text-white font-bold rounded-xl text-xs shadow-md mt-2">新增項目</button>
      </form>
    </div>
  </div>

  <!-- Modal 3: 新增股票存股 -->
  <div id="modal-stock" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center">
    <div class="bg-white dark:bg-ios-cardDark w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-800 pb-3">
        <h3 class="font-bold text-base">新增持股標的</h3>
        <button onclick="closeModal('modal-stock')" class="text-ios-gray"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="handleAddStock(event)" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] text-ios-gray font-medium">股票名稱</label>
            <input type="text" id="stk-name" required placeholder="如：台積電" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none" />
          </div>
          <div>
            <label class="text-[11px] text-ios-gray font-medium">股票代號</label>
            <input type="text" id="stk-code" required placeholder="如：2330" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] text-ios-gray font-medium">持有股數</label>
            <input type="number" id="stk-shares" required placeholder="如：1000" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none" />
          </div>
          <div>
            <label class="text-[11px] text-ios-gray font-medium">買入均價 (NTD)</label>
            <input type="number" step="0.1" id="stk-cost" required placeholder="如：580" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] text-ios-gray font-medium">當前現價 (NTD)</label>
            <input type="number" step="0.1" id="stk-price" required placeholder="如：980" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none" />
          </div>
          <div>
            <label class="text-[11px] text-ios-gray font-medium">預估每股年股利</label>
            <input type="number" step="0.1" id="stk-dividend" placeholder="如：18" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-xs outline-none" />
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-ios-blue text-white font-bold rounded-xl text-xs shadow-md mt-2">新增持股</button>
      </form>
    </div>
  </div>

  <!-- Modal 4: 修改發票條碼 -->
  <div id="modal-carrier" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center">
    <div class="bg-white dark:bg-ios-cardDark w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-800 pb-3">
        <h3 class="font-bold text-base">設定手機條碼載具</h3>
        <button onclick="closeModal('modal-carrier')" class="text-ios-gray"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="handleUpdateCarrier(event)" class="space-y-3">
        <div>
          <label class="text-[11px] text-ios-gray font-medium">手機條碼 (含斜線，共8碼)</label>
          <input type="text" id="carrier-input" required placeholder="/AB12345" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-ios-grayDark rounded-xl text-base font-mono font-bold text-ios-blue outline-none uppercase" />
        </div>
        <button type="submit" class="w-full py-3 bg-ios-blue text-white font-bold rounded-xl text-xs shadow-md mt-2">儲存變更</button>
      </form>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // State Management using LocalStorage
    let state = {
      transactions: JSON.parse(localStorage.getItem('wf_transactions')) || [],
      recurring: JSON.parse(localStorage.getItem('wf_recurring')) || [],
      stocks: JSON.parse(localStorage.getItem('wf_stocks')) || [],
      carrierCode: localStorage.getItem('wf_carrier') || '/AB12345'
    };

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderAll();
    });

    function saveState() {
      localStorage.setItem('wf_transactions', JSON.stringify(state.transactions));
      localStorage.setItem('wf_recurring', JSON.stringify(state.recurring));
      localStorage.setItem('wf_stocks', JSON.stringify(state.stocks));
      localStorage.setItem('wf_carrier', state.carrierCode);
      renderAll();
    }

    function renderAll() {
      renderTransactions();
      renderRecurring();
      renderStocks();
      renderBarcode();
    }

    // Toggle Demo Data
    function toggleDemoData() {
      if (state.transactions.length > 0 || state.stocks.length > 0) {
        if (confirm('是否要清空所有紀錄與資料？')) {
          state.transactions = [];
          state.recurring = [];
          state.stocks = [];
          saveState();
        }
      } else {
        // Load Sample Initial Data
        state.transactions = [
          { id: 1, type: 'expense', amount: 160, category: '餐飲美食', account: '信用卡', note: '午餐便當加飲料', date: '10/01' },
          { id: 2, type: 'expense', amount: 1200, category: '休閒娛樂', account: '信用卡', note: '電影票與聚餐', date: '09/29' },
          { id: 3, type: 'income', amount: 48000, category: '工作薪資', account: '銀行帳戶', note: '月薪入帳', date: '09/25' }
        ];
        state.recurring = [
          { id: 1, title: 'Netflix 4K 訂閱', amount: 390, day: 15, type: 'expense' },
          { id: 2, title: '套房租金', amount: 12000, day: 1, type: 'expense' }
        ];
        state.stocks = [
          { id: 1, name: '台積電', code: '2330', shares: 1000, cost: 580, price: 980, dividend: 18 },
          { id: 2, name: '元大高股息', code: '0056', shares: 5000, cost: 32, price: 38.5, dividend: 3.5 }
        ];
        saveState();
      }
    }

    // Tab Switcher
    function switchTab(tabId, title) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      document.getElementById('appTitle').innerText = title;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.tab === tabId) {
          btn.classList.replace('text-ios-gray', 'text-ios-blue');
        } else {
          btn.classList.replace('text-ios-blue', 'text-ios-gray');
        }
      });
    }

    // Modal Operations
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Dark Mode Toggle
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    // ================= 1. 記帳 Logic =================
    function setTxType(type) {
      document.getElementById('tx-type').value = type;
      const btnExp = document.getElementById('btn-type-expense');
      const btnInc = document.getElementById('btn-type-income');

      if (type === 'expense') {
        btnExp.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg bg-white dark:bg-gray-800 shadow-sm text-ios-red';
        btnInc.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg text-ios-gray';
      } else {
        btnInc.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg bg-white dark:bg-gray-800 shadow-sm text-ios-green';
        btnExp.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg text-ios-gray';
      }
    }

    function handleAddTransaction(e) {
      e.preventDefault();
      const type = document.getElementById('tx-type').value;
      const amount = Number(document.getElementById('tx-amount').value);
      const category = document.getElementById('tx-category').value;
      const account = document.getElementById('tx-account').value;
      const note = document.getElementById('tx-note').value || category;

      state.transactions.unshift({
        id: Date.now(),
        type,
        amount,
        category,
        account,
        note,
        date: new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' })
      });

      closeModal('modal-transaction');
      document.getElementById('tx-amount').value = '';
      document.getElementById('tx-note').value = '';
      saveState();
    }

    function deleteTransaction(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      saveState();
    }

    function renderTransactions() {
      const container = document.getElementById('transactionList');
      container.innerHTML = '';

      let totalIncome = 0;
      let totalExpense = 0;

      if (state.transactions.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-ios-gray">尚無消費紀錄，點擊右上角新增</div>`;
      } else {
        state.transactions.forEach(t => {
          if (t.type === 'income') totalIncome += t.amount;
          if (t.type === 'expense') totalExpense += t.amount;

          const isExp = t.type === 'expense';
          const itemHtml = `
            <div class="flex items-center justify-between p-3 bg-ios-cardLight dark:bg-ios-cardDark rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl ${isExp ? 'bg-red-50 text-ios-red' : 'bg-green-50 text-ios-green'} flex items-center justify-center font-bold text-sm">
                  ${t.category.slice(0, 2)}
                </div>
                <div>
                  <p class="text-xs font-bold text-gray-900 dark:text-gray-100">${t.note}</p>
                  <p class="text-[10px] text-ios-gray">${t.date} · ${t.account}</p>
                </div>
              </div>
              <div class="flex items-center space-x-3">
                <span class="text-sm font-extrabold ${isExp ? 'text-ios-red' : 'text-ios-green'}">
                  ${isExp ? '-' : '+'}NT$ ${t.amount.toLocaleString()}
                </span>
                <button onclick="deleteTransaction(${t.id})" class="text-gray-400 hover:text-ios-red"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', itemHtml);
        });
      }

      document.getElementById('summaryIncome').innerText = `NT$ ${totalIncome.toLocaleString()}`;
      document.getElementById('summaryExpense').innerText = `NT$ ${totalExpense.toLocaleString()}`;
      document.getElementById('summaryNet').innerText = `NT$ ${(totalIncome - totalExpense).toLocaleString()}`;
      lucide.createIcons();
    }

    // ================= 2. 固定收支 Logic =================
    function handleAddRecurring(e) {
      e.preventDefault();
      const title = document.getElementById('rec-title').value;
      const amount = Number(document.getElementById('rec-amount').value);
      const day = Number(document.getElementById('rec-day').value);
      const type = document.getElementById('rec-type').value;

      state.recurring.push({ id: Date.now(), title, amount, day, type });
      closeModal('modal-recurring');
      saveState();
    }

    function deleteRecurring(id) {
      state.recurring = state.recurring.filter(r => r.id !== id);
      saveState();
    }

    function renderRecurring() {
      const container = document.getElementById('recurringList');
      container.innerHTML = '';
      let totalCost = 0;

      if (state.recurring.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-ios-gray">尚無固定收支項目</div>`;
      } else {
        state.recurring.forEach(r => {
          if (r.type === 'expense') totalCost += r.amount;
          const html = `
            <div class="flex items-center justify-between p-3 bg-ios-cardLight dark:bg-ios-cardDark rounded-2xl border border-gray-100 dark:border-gray-800">
              <div>
                <p class="text-xs font-bold">${r.title}</p>
                <p class="text-[10px] text-ios-gray">每月 ${r.day} 號自動扣款/提醒</p>
              </div>
              <div class="flex items-center space-x-3">
                <span class="text-sm font-bold ${r.type === 'expense' ? 'text-ios-red' : 'text-ios-green'}">
                  ${r.type === 'expense' ? '-' : '+'}NT$ ${r.amount.toLocaleString()}
                </span>
                <button onclick="deleteRecurring(${r.id})" class="text-gray-400 hover:text-ios-red"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', html);
        });
      }

      document.getElementById('recurringTotalCost').innerText = `NT$ ${totalCost.toLocaleString()}`;
      lucide.createIcons();
    }

    // ================= 3. 股票存股 Logic =================
    function handleAddStock(e) {
      e.preventDefault();
      const name = document.getElementById('stk-name').value;
      const code = document.getElementById('stk-code').value;
      const shares = Number(document.getElementById('stk-shares').value);
      const cost = Number(document.getElementById('stk-cost').value);
      const price = Number(document.getElementById('stk-price').value);
      const dividend = Number(document.getElementById('stk-dividend').value) || 0;

      state.stocks.push({ id: Date.now(), name, code, shares, cost, price, dividend });
      closeModal('modal-stock');
      saveState();
    }

    function deleteStock(id) {
      state.stocks = state.stocks.filter(s => s.id !== id);
      saveState();
    }

    function renderStocks() {
      const container = document.getElementById('stockList');
      container.innerHTML = '';

      let totalMarketValue = 0;
      let totalCost = 0;
      let totalAnnualDividend = 0;

      if (state.stocks.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-ios-gray">尚無持股標的，點擊右上角新增</div>`;
      } else {
        state.stocks.forEach(s => {
          const mktValue = s.shares * s.price;
          const costValue = s.shares * s.cost;
          const pnl = mktValue - costValue;
          const pnlRate = costValue > 0 ? ((pnl / costValue) * 100).toFixed(2) : 0;
          const annDiv = s.shares * s.dividend;

          totalMarketValue += mktValue;
          totalCost += costValue;
          totalAnnualDividend += annDiv;

          const isGain = pnl >= 0;

          const html = `
            <div class="p-3.5 bg-ios-cardLight dark:bg-ios-cardDark rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="text-xs font-bold">${s.name} <span class="text-ios-gray font-normal">(${s.code})</span></h3>
                  <p class="text-[10px] text-ios-gray mt-0.5">${s.shares.toLocaleString()} 股 · 買入均價 NT$ ${s.cost}</p>
                </div>
                <div class="text-right">
                  <p class="text-xs font-extrabold">NT$ ${mktValue.toLocaleString()}</p>
                  <p class="text-[10px] font-bold ${isGain ? 'text-ios-red' : 'text-ios-green'}">
                    ${isGain ? '+' : ''}${pnl.toLocaleString()} (${pnlRate}%)
                  </p>
                </div>
              </div>
              <div class="flex justify-between items-center pt-2 border-t border-gray-100 dark:border-gray-800 text-[10px] text-ios-gray">
                <span>當前現價: NT$ ${s.price} | 預估年股利: NT$ ${annDiv.toLocaleString()}</span>
                <button onclick="deleteStock(${s.id})" class="text-gray-400 hover:text-ios-red"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', html);
        });
      }

      const totalPnl = totalMarketValue - totalCost;
      const totalPnlRate = totalCost > 0 ? ((totalPnl / totalCost) * 100).toFixed(2) : 0;
      const isTotalGain = totalPnl >= 0;

      document.getElementById('stockMarketValue').innerText = `NT$ ${totalMarketValue.toLocaleString()}`;
      document.getElementById('stockPnl').innerText = `NT$ ${totalPnl.toLocaleString()} (${totalPnlRate}%)`;
      document.getElementById('stockPnl').className = `text-base font-bold mt-0.5 ${isTotalGain ? 'text-ios-red' : 'text-ios-green'}`;
      document.getElementById('stockAnnualDividend').innerText = `NT$ ${totalAnnualDividend.toLocaleString()}`;
      lucide.createIcons();
    }

    // ================= 4. 發票載具 Logic =================
    function handleUpdateCarrier(e) {
      e.preventDefault();
      const code = document.getElementById('carrier-input').value.trim();
      if (code) {
        state.carrierCode = code;
        closeModal('modal-carrier');
        saveState();
      }
    }

    function renderBarcode() {
      document.getElementById('displayCarrierCode').innerText = state.carrierCode;
      try {
        JsBarcode("#barcodeSvg", state.carrierCode, {
          format: "CODE39",
          displayValue: false,
          lineColor: "#000",
          height: 70,
          margin: 0
        });
      } catch (err) {
        console.error("Barcode Generation Error: ", err);
      }
    }

    let isMaxBright = false;
    function toggleMaxBrightness() {
      const card = document.getElementById('barcodeCard');
      const text = document.getElementById('brightText');
      isMaxBright = !isMaxBright;
      if (isMaxBright) {
        card.classList.add('ring-4', 'ring-amber-400', 'scale-105');
        text.innerText = "恢復亮度";
      } else {
        card.classList.remove('ring-4', 'ring-amber-400', 'scale-105');
        text.innerText = "螢幕亮點";
      }
    }
  </script>
</body>
</html>
